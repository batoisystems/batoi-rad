name: Bug report
description: Report a reproducible Batoi RAD problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include passwords, API keys, personal data, or private logs.
  - type: input
    id: version
    attributes:
      label: Batoi RAD version
      placeholder: 1.0.0-rc.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, MySQL, web server, browser, and operating system versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
